spring:
  application:
    name: store-api

  datasource:
    url: jdbc:h2:mem:store;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: store:session
      flush-mode: on_save
      save-mode: on_set_attribute

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        secure: false